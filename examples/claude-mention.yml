# Example GitHub Actions workflow that responds to `@claude …` mentions
# in PR / issue comments. Copy to `.github/workflows/` and adapt the
# sections marked TODO / REPO-SPECIFIC.
#
# Requires:
#   - `ANTHROPIC_API_KEY` repository secret
#   - All action `uses:` pinned to a commit SHA
name: Claude Mention Handler

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Queue explicit mentions per PR/issue — don't cancel. A user who
  # mentions Claude twice in quick succession probably wants both
  # honored (or the second after the first finishes), not the first
  # killed mid-flight.
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  work:
    # Belt-and-suspenders gate:
    # 1. Comment must contain the trigger phrase.
    # 2. Commenter must be org OWNER / MEMBER or a repo COLLABORATOR.
    #    (claude-code-action performs its own write-access check as fallback.)
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Write access is intentional — mention mode is "do work", which
      # means editing files, committing, and pushing.
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout
        # Default shallow fetch (depth 1). The agent can commit and push on
        # a shallow clone; `git log` / `git blame` aren't reached for by
        # the current prompt. Bump to a deeper fetch only if you direct the
        # agent at history lookups.
        uses: actions/checkout@<pinned-sha> # TODO: pin, e.g. v4.3.1

      - name: Parse mention
        # Real precision gate (the job-level `if:` is a cheap pre-filter).
        # Enforces:
        #   1. `@claude` must be the FIRST non-whitespace token (word-
        #      boundary after) — rules out `@claudette`, inline prose
        #      mentions ("saw @claude's fix"), and quoted replies
        #      (`> @claude ...`) where the reply is addressing a human.
        #   2. Case-insensitive word-boundary `deep` anywhere in the body
        #      → escalate to Opus. Sonnet is the default.
        id: mention
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail

          if ! printf '%s' "$BODY" | grep -Pqz '\A\s*@claude\b'; then
            echo "Comment does not start with @claude; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$BODY" | grep -Piq '\bdeep\b'; then
            echo "model=claude-opus-5" >> "$GITHUB_OUTPUT"
            echo "Selected claude-opus-5 (deep requested)"
          else
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
            echo "Selected claude-sonnet-5 (default)"
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Clone shared Harper skills
        # Optional — only needed if your prompt references a skill file.
        if: steps.mention.outputs.proceed == 'true'
        uses: actions/checkout@<pinned-sha> # TODO: pin
        with:
          repository: HarperFast/skills
          ref: <pinned-sha-or-tag>
          path: .harper-skills

      # REPO-SPECIFIC: include whichever runtime setup steps your repo's
      # tests / lint / build need. This example matches a typical
      # Node + Bun repo. Note that we DO NOT eagerly `npm ci` — most
      # mentions don't need deps, and ~35-60s install × every mention
      # adds up. The prompt tells the agent to install when needed.
      - name: Setup Node.js
        if: steps.mention.outputs.proceed == 'true'
        uses: actions/setup-node@<pinned-sha> # TODO: pin
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Bun
        if: steps.mention.outputs.proceed == 'true'
        uses: oven-sh/setup-bun@<pinned-sha> # TODO: pin
        with:
          bun-version: latest

      - name: Claude (agent mode)
        if: steps.mention.outputs.proceed == 'true'
        id: claude-agent
        uses: anthropics/claude-code-action@<pinned-sha> # TODO: pin
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Note: `allowed_bots:` is not set here because this workflow
          # triggers on `issue_comment` / `pull_request_review_comment`,
          # whose authors are people posting comments — not bots opening
          # PRs. See examples/claude-review.yml for why the review
          # workflow needs the allowlist.
          claude_args: |
            --model ${{ steps.mention.outputs.model }}
            --max-turns 96
            # Tool allowlist — keep tight. Every entry here is a potential
            # prompt-injection RCE primitive if a malicious input steers the
            # agent toward it. Notably ABSENT by design:
            #   * `Bash(npx:*)` — lets an injected prompt run arbitrary
            #     published packages (the biggest RCE surface). If your
            #     workflow genuinely needs a specific npx command, add it
            #     explicitly — e.g. `Bash(npx prettier:*)`.
            #   * `Bash(npm install:*)` — allows arbitrary package install.
            #     Use the no-arg form `Bash(npm install)` when you need to
            #     regenerate a lockfile from an edited package.json.
            # Partial mitigation NOTE: no-arg `Bash(npm install)` blocks
            # `npm install @attacker/<name>` but NOT the postinstall path.
            # An injection can Edit package.json to add a malicious
            # `postinstall` script and then invoke bare `npm install` to
            # execute it, with GITHUB_TOKEN reachable in the subprocess
            # env. Branch protection + the author_association gate are
            # what actually bound blast radius; this allowlist does not.
            # Consider adding `.npmrc` with `ignore-scripts=true` in your
            # repo if you want to close the postinstall path at the npm
            # config level.
            --allowedTools "Read,Write,Edit,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checkout:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(git:*),Bash(npm install),Bash(npm ci:*),Bash(npm run:*),Bash(npm test:*),Bash(bun install:*),Bash(bun run:*),Bash(bun test:*)"
          # In agent mode the action can use the triggering comment as the
          # prompt, but we inline it explicitly below to guarantee the agent
          # always has PR/issue number, URL, and the commenter's exact
          # request.
          #
          # TODO: revisit if a future claude-code-action release reliably
          # forwards the triggering comment as the prompt.
          prompt: |
            You were invoked via an `@claude` mention on ${{ github.repository }}.

            ## Mention context

            - Repo: ${{ github.repository }}
            - Target number: #${{ github.event.issue.number || github.event.pull_request.number }}
            - Target URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
            - Target kind: ${{ github.event.issue.pull_request && 'pull request' || (github.event.pull_request && 'pull request' || 'issue') }}
            - Commenter: @${{ github.event.comment.user.login }}

            The commenter wrote (verbatim, including any multi-line content):

            ```
            ${{ github.event.comment.body }}
            ```

            Start by reading the target so you have real context:
            - For a PR: `gh pr view <N>` then `gh pr diff <N>` if you need
              the changes.
            - For an issue: `gh issue view <N>`.

            Then act on the request. If the request is "review this PR",
            follow the review discipline from the layered review scope
            used by your review workflow (see `examples/claude-review.yml`
            in https://github.com/HarperFast/ai-review-prompts for the
            shape) — do NOT treat review as a code-edit task.

            ## Conventions

            Read the repo's agent context files first (commonly
            `CLAUDE.md`, `AGENTS.md`, or similar at the repo root). Their
            conventions and gotchas apply to any code you write. Match the
            repo's existing style rather than introducing a new one.

            For any change touching deployment patterns, docs about
            production, or Harper best practices, also consult the
            shared skills at `.harper-skills/harper-best-practices/rules/`
            (if you cloned skills above). In particular,
            `.harper-skills/harper-best-practices/rules/deploying-to-harper-fabric.md`
            is authoritative for Harper's deployment model (Fabric). Do
            NOT recommend generic patterns (systemd units, raw
            Kubernetes, cloud secrets managers) without first checking
            whether a Harper-specific path applies.

            ## Documentation scope boundary

            Harper maintains authoritative documentation at
            https://docs.harperdb.io covering core, pro, and fabric. This
            repo's docs should NOT re-explain Harper mechanics that the
            Harper docs already cover — they drift out of sync when the
            Harper docs update.

            When writing or revising docs here:

            - Document what's specific to THIS component — env var names,
              config shape, setup flow, integration API.
            - For anything not component-specific (deployment mechanics,
              runtime env var handling, Fabric configuration, core Harper
              behavior, SQL, replication), LINK to the Harper docs rather
              than re-explaining.

            This is a general rule, not specific to any one area.

            ## Before committing

            Scale validation to the kind of change you made:

            - Doc-only change: run `npm run format:check` and `npm run lint`.
              Skip the full build/test path — not affected and wastes turns.
            - Code or config change that affects behavior: run
              `npm run build && npm run lint && npm run format:check && npm test`
              (and whatever else your repo requires). Fix anything that fails.

            REPO-SPECIFIC: adjust the validation commands to match your repo.
            Flag any files that LOOK doc-only but aren't (e.g. a `config.yaml`
            that holds runtime defaults).

            When in doubt, err toward the fuller validation.

            ## Output

            - Scope your changes to exactly what the mention asked for.
              Don't refactor unrelated code.
            - Commit with a descriptive message referencing the issue/PR.
            - If the request is ambiguous or you have to make a judgment
              call that changes public API or semantics, post a comment
              on the PR/issue explaining your interpretation and stop —
              do NOT push speculative changes.
            - Do NOT use REQUEST_CHANGES or APPROVE on PRs. Post comments
              or push commits only.

name: Claude Issue-to-PR Handler (reusable)

# Reusable workflow that handles `claude-fix:*` labels on issues.
# Labeling kicks Claude off in agent mode: read the issue, make a
# focused change scoped to the label, push a branch, open a PR.
# Distinct from `_claude-mention.yml` (which responds to comment
# mentions, can target PRs or issues) and `_claude-review.yml`
# (read-only PR review).
#
# Consumer caller shape:
#
#     name: Claude Issue to PR
#     on:
#       issues:
#         types: [labeled]
#     concurrency:
#       group: claude-issue-${{ github.event.issue.number }}
#       cancel-in-progress: false
#     jobs:
#       work:
#         uses: HarperFast/ai-review-prompts/.github/workflows/_claude-issue-to-pr.yml@<sha>
#         with:
#           ai-review-prompts-ref: <sha>  # same SHA as above
#           setup-bun: true               # only if the repo's scripts need bun
#           repo-specific-conventions: |
#             - Linter is oxlint, not eslint. ...
#         secrets:
#           ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#           HARPERFAST_AI_CLIENT_ID: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
#           HARPERFAST_AI_APP_PRIVATE_KEY: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}
#
# Required org-level secrets (configure once on the HarperFast org):
#   HARPERFAST_AI_CLIENT_ID
#   HARPERFAST_AI_APP_PRIVATE_KEY
#
# The trigger label set is the canonical four (`claude-fix:typo`,
# `:docs`, `:deps`, `:bug`). Hard-coded in both the auth-job `if:`
# pre-filter AND the prompt's label-scope guidance — they have to
# match. If a future use case needs a different label set, that's
# when we add an input.

on:
  workflow_call:
    inputs:
      ai-review-prompts-ref:
        description: 'SHA pin for HarperFast/ai-review-prompts (auth script). REQUIRED; pass the same SHA the caller uses in its `uses:` ref. We can''t auto-derive this — `github.workflow_ref` resolves to the CALLER''s ref in `workflow_call` context, not the called workflow''s ref.'
        type: string
        required: true
      skills-ref:
        description: 'SHA pin for HarperFast/skills (mounted at .harper-skills/ for the agent to consult shared best-practice rules).'
        type: string
        default: 'd2db99bb37a6dde868cbc5ac81ca4146be8956fb'  # 1.3.0 (2026-04-16)
      max-turns:
        description: 'Per-invocation turn budget. Issue-to-PR does the most authoring work of the three modes (read, change, validate, push, PR-open) — keep this generous (72 default).'
        type: number
        default: 72
      timeout-minutes:
        description: 'Job-level timeout for the work job. Headroom over the agent step; not the cost ceiling (max-turns is).'
        type: number
        default: 25
      setup-bun:
        description: 'Add an oven-sh/setup-bun step. Set true for repos whose scripts/tests run via bun (e.g. plugin repos like HarperFast/oauth). Harper core leaves this off.'
        type: boolean
        default: false
      repo-specific-conventions:
        description: 'Markdown block injected into the prompt after the universal "Conventions" section. Use for repo-specific code conventions (linter quirks, runtime engine, package conventions, doc-scope boundaries) the agent should respect when authoring code.'
        type: string
        default: ''
      pre-commit-validation:
        description: 'Markdown block injected as the "Validation" sub-section of the prompt''s Process. Defaults to a Node-only flow scaled by the `claude-fix:*` label suffix. Override for repos with different test commands.'
        type: string
        default: |
          - `claude-fix:typo` / `claude-fix:docs` (doc-only changes
            to `*.md` — e.g. `README.md`, `CLAUDE.md`, `AGENTS.md`,
            `dependencies.md` — or `package.json` keyword/description
            fields): run `npm run format:check` and `npm run lint`.
            Skip `npm run build` / `npm run test:unit` — they are
            not affected and waste turns.
          - `claude-fix:deps` / `claude-fix:bug` or any change that
            touches code: run
            `npm run build && npm run lint && npm run format:check && npm run test:unit`.
            Fix anything that fails. Integration tests
            (`npm run test:integration`) are slow — run only if the
            change plausibly affects integration behavior.

          When in doubt, err toward the fuller validation.
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      HARPERFAST_AI_CLIENT_ID:
        required: true
      HARPERFAST_AI_APP_PRIVATE_KEY:
        required: true

jobs:
  authorize:
    # Single source of truth for "is this label trigger allowed to
    # spawn Claude on this repo?". The `work` job below has ONE `if:`
    # that depends on this — no step-level guards, no individual user
    # list to maintain.
    #
    # Cheap pre-filter at job level: explicit allow-list of the four
    # `claude-fix:*` labels (NOT `startsWith('claude-fix:')`, which
    # would match typoed variants like `claude-fix:typos` and the
    # agent would waste turns interpreting them).
    #
    # Trust set: the @HarperFast teams listed in the CONSUMER repo's
    # `.github/CODEOWNERS`. Same set as the people we trust to review
    # code; alignment by construction. If CODEOWNERS is missing,
    # empty, or has no `@HarperFast/<team>` handles, falls back to
    # `@HarperFast/developers`. External-org handles are deliberately
    # ignored. `claude[bot]` is NOT admitted on the issue-to-PR path
    # (avoids self-loops on bot-applied labels).
    #
    # We check the LABELER (`github.actor`), not the issue author. The
    # labeler must already have at least triage permission to apply
    # the label; a maintainer labeling an external-author issue is a
    # legitimate way to invoke the agent on community reports.
    #
    # Team-membership reads need an `Organization: Members: Read`
    # token, which the default `GITHUB_TOKEN` lacks. We mint an
    # installation token from an org-wide HarperFast GitHub App
    # (Members: Read scope only) and use it ONLY in this job — the
    # work job uses the default `GITHUB_TOKEN`, so the org-read
    # capability never reaches the agent step.
    if: contains(fromJSON('["claude-fix:typo","claude-fix:docs","claude-fix:deps","claude-fix:bug"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      # contents: read for the .github/CODEOWNERS fetch via default token.
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Mint org-read token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
          private-key: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}
          owner: HarperFast

      - name: Sparse-checkout consumer's CODEOWNERS
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github/CODEOWNERS
          sparse-checkout-cone-mode: false

      - name: Sparse-checkout ai-review-prompts auth script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/ai-review-prompts
          ref: ${{ inputs.ai-review-prompts-ref }}
          path: .ai-review-prompts
          sparse-checkout: |
            .github/scripts/authorize-claude-workflow.sh
          sparse-checkout-cone-mode: false

      - name: Check labeler authorization
        id: check
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          ORG_TOKEN: ${{ steps.app-token.outputs.token }}
          ADMIT_CLAUDE_BOT: 'false'
          USERS_TO_CHECK: ${{ github.actor }}
        run: bash .ai-review-prompts/.github/scripts/authorize-claude-workflow.sh

  work:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # Write access is intentional — issue-to-PR mode is "do work":
      # branch creation, file edits, commits, push, PR open, issue
      # comment.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        # Default shallow fetch (depth 1). The agent can commit and push
        # on a shallow clone; `git log` / `git blame` aren't reached for
        # by the current prompt. Bump to a deeper fetch only if we see
        # the agent blocked on history lookups.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clone shared Harper skills
        # Pinned to a SHA so agent behavior is reproducible across
        # runs — updates require an explicit pin bump on this
        # workflow's `skills-ref` input.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/skills
          ref: ${{ inputs.skills-ref }}
          path: .harper-skills

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Bun
        # Opt-in for repos whose tests/scripts run via bun (plugin
        # repos like HarperFast/oauth). Skipped by default to keep
        # the common path fast.
        if: inputs.setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        # Issue-to-PR is more code-oriented than mention; the agent
        # almost always needs deps. Install upfront rather than
        # making the agent burn turns on `npm ci` itself.
        run: npm ci

      - name: Claude (agent mode)
        id: claude-agent
        uses: anthropics/claude-code-action@ef50f123a3a9be95b60040d042717517407c7256 # v1.0.110
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns ${{ inputs.max-turns }}
            # `--allowedTools` is convenience pre-approval, not a
            # security boundary. Per claude-code-action's
            # `docs/configuration.md` (v1.0.110): "The base GitHub
            # tools are always included. Use `--allowedTools` to add
            # additional tools, and `--disallowedTools` to prevent
            # specific tools from being used." Tools NOT listed below
            # will still execute — in CI's non-interactive mode (no
            # `canUseTool` callback set by claude-code-action), the
            # SDK's `default` permission mode falls through to
            # "execute" rather than prompting.
            #
            # Real containment for this workflow (issue-to-PR mode
            # does AUTHORING work — branch creation, file edits,
            # commits, push, PR open):
            #   * Token scope: `contents: write`, `pull-requests: write`,
            #     `issues: write`, `id-token: write`. Repo-scoped only.
            #   * Branch protection on protected refs (`main` /
            #     `release_*` / `v*.x`) — the agent CAN run
            #     `git push --force` if it tries; what stops protected-
            #     ref damage is GitHub's ruleset.
            #   * Auth gate (CODEOWNERS-driven HarperFast team
            #     check) — only trusted labelers trigger the
            #     workflow at all.
            #   * Allowed-labels list (`claude-fix:typo` / `:docs` /
            #     `:deps` / `:bug`) — narrow trigger surface.
            #   * Runner ephemerality.
            #   * Prompt-injection guards in the prompt itself.
            #
            # Notable absences in spirit (containment is elsewhere):
            #   * `Bash(npx:*)` — would let an injected instruction
            #     run arbitrary published packages.
            #   * `Bash(npm install)` (no-arg, not `Bash(npm install:*)`) —
            #     "tightening" is illusory: the agent has `Write`/`Edit`
            #     on package.json and can construct an injected
            #     `postinstall` script + bare `npm install` chain.
            #     A future PR may add `ignore-scripts=true` via
            #     `.npmrc` and/or defer installs to a separate CI job
            #     for actual enforcement.
            #
            # Bun entries are present unconditionally (additive
            # pre-approval is harmless; the bun binary just isn't on
            # PATH for runs that don't set `setup-bun: true`).
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(git:*),Bash(npm install),Bash(npm ci:*),Bash(npm run:*),Bash(npm test:*),Bash(bun install:*),Bash(bun run:*),Bash(bun test:*)"
          prompt: |
            You were invoked because issue #${{ github.event.issue.number }}
            on ${{ github.repository }} was labeled
            `${{ github.event.label.name }}`.

            ## The ask

            Title: `${{ github.event.issue.title }}`

            Body (verbatim, including any multi-line content):

            ```
            ${{ github.event.issue.body }}
            ```

            Source: ${{ github.event.issue.html_url }}

            ## Label-scoped behavior

            The label suffix tells you how much latitude you have:

            - `claude-fix:typo` — a single-file typo, prose tweak, or
              tiny doc fix. Should be one or two lines changed.
            - `claude-fix:docs` — a documentation update. Code should
              not be touched unless the doc is literally a code
              comment.
            - `claude-fix:deps` — a dependency version bump. Update
              `package.json` and regenerate the lockfile via
              `npm install` + verify `npm ci` works.
            - `claude-fix:bug` — a focused bug fix with at least one
              test that fails before the fix and passes after.

            Any ask that requires judgment beyond the label's scope —
            new public API, architecture changes, cross-cutting
            refactors — is OUT of scope. In that case, comment on
            the issue explaining what you see and do NOT open a PR.

            ## Conventions

            Read the repo's agent context files first (commonly
            `CLAUDE.md`, `AGENTS.md`, or similar at the repo root).
            Their conventions and gotchas apply. Match the repo's
            existing style rather than introducing a new one.

            Shared Harper best-practices are mirrored on disk at
            `.harper-skills/harper-best-practices/rules/*.md` if you
            need to drill into the customer-facing source. In
            particular,
            `.harper-skills/harper-best-practices/rules/deploying-to-harper-fabric.md`
            is authoritative for Harper's deployment model. Do NOT
            invent generic production patterns (systemd units, raw
            Kubernetes, cloud secrets managers, arbitrary .env
            recommendations) without first checking whether a
            Harper-specific path applies.

            ${{ inputs.repo-specific-conventions }}

            ## Process

            1. Create a branch named `claude/fix-${{ github.event.issue.number }}`
               (or append `-<short-desc>` if useful).
            2. Make the change scoped to the label.
            3. Validate, scaling to the kind of change you made:

               ${{ inputs.pre-commit-validation }}
            4. Commit with a descriptive message.
            5. Push the branch and open a PR via `gh pr create` with
               a body that says `Closes #${{ github.event.issue.number }}`.
            6. Post a comment on the original issue linking to the PR.

            ## Must NOT

            - Do NOT push to `main` or any `release_*` / `v*.x`
              branch.
            - Do NOT use REQUEST_CHANGES or APPROVE on any PR.
            - Do NOT open a PR when the ask is out of scope —
              comment and stop.
            - Do NOT commit secrets, credentials, or large generated
              artifacts (e.g. `node_modules/`, coverage output).

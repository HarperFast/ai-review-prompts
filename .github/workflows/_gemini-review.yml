name: Gemini PR Review (reusable)

# Reusable workflow that performs an AI-assisted PR review using
# Gemini via MCP-based agentic tool use.
#
# ─────────────────────────────────────────────────────────────────
# Architecture is adopted from Google's official PR review example
# for `run-gemini-cli`:
#
#   google-github-actions/run-gemini-cli@f77273f4 (v0.1.22)
#     examples/workflows/pr-review/gemini-review.yml
#     examples/workflows/pr-review/gemini-review.toml
#     examples/workflows/pr-review/README.md
#
# What we adopt from upstream:
#   - Docker'd `github-mcp-server` for inline-comment posting and
#     PR-data access (umbrella tools: `pull_request_read`,
#     `pull_request_review_write`, plus `add_comment_to_pending_review`)
#   - Constrained `tools.core` shell allowlist
#   - `settings.json` structure for telemetry, modelConfigs, mcpServers
#   - Prompt-level patterns: input demarcation, fact-based review,
#     command-substitution prohibition, severity tagging,
#     create-pending → add-comments → submit submission flow
#
# What we change from upstream:
#   - Custom slash command (`/harper-review`) composed at runtime
#     from our layered review scope (universal + harper/common +
#     harper/v5 + repo-type/plugin + repo-specific-checks). The
#     layered scope is our value-add — see compose-gemini-review-toml.sh.
#   - Auth gate via the HarperFast AI Workflows App (CODEOWNERS-derived
#     trust set), not upstream's `vars.APP_ID` / Google-Cloud-vars setup.
#   - Severity discipline: only `🔴 Critical` and `🟠 High` are posted.
#     `🟡 Medium` / `🟢 Low` map to our universal-scope "do not post"
#     category and are explicitly forbidden in the custom TOML.
#   - Log surface: each review threads into a per-(PR, provider)
#     issue in HarperFast/ai-review-log with the `provider:gemini`
#     label. The Gemini summary comment carries a
#     `<!-- gemini-review:v1 -->` marker for find-prior lookup.
#   - No separate post-step: the agent posts the review itself via
#     MCP (this replaces the prior single-shot architecture, where
#     the workflow posted the response on the agent's behalf).
#
# Why not call upstream's reusable directly?
#   - Their workflow has no `on: workflow_call:` trigger — it's a
#     top-level entry workflow, not callable.
#   - Their architecture has no layered review scope, no auth gate
#     against the consumer repo's CODEOWNERS, no integration with our
#     log surface.
#   - It uses different secrets/vars (`vars.APP_ID`, GCP Workload
#     Identity Federation, etc.) — wiring our setup to theirs would
#     mean reauthoring the gate from scratch.
# So we adopt their architectural patterns and reimplement around
# our auth / scope / log model.
# ─────────────────────────────────────────────────────────────────
#
# Consumer caller shape:
#
#     name: Gemini PR Review
#     on:
#       pull_request:
#         types: [opened, synchronize, reopened]
#     concurrency:
#       group: gemini-review-${{ github.event.pull_request.number }}
#       cancel-in-progress: true
#     jobs:
#       review:
#         uses: HarperFast/ai-review-prompts/.github/workflows/_gemini-review.yml@<sha>
#         with:
#           review-layers: |
#             universal
#             harper/common
#             harper/v5
#           repo-specific-checks: |
#             ## Repo-specific checks (<repo>)
#             - …
#         secrets:
#           GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
#           AI_REVIEW_LOG_TOKEN: ${{ secrets.AI_REVIEW_LOG_TOKEN }}
#           HARPERFAST_AI_CLIENT_ID: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
#           HARPERFAST_AI_APP_PRIVATE_KEY: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}
#
# Required secrets:
#   GEMINI_API_KEY                  — Gemini API key (optional — see
#                                     comment in the secrets block)
#   HARPERFAST_AI_CLIENT_ID         — App Client ID for the auth gate
#   HARPERFAST_AI_APP_PRIVATE_KEY   — App private key for the auth gate
#   AI_REVIEW_LOG_TOKEN             — optional; threads each run
#                                     into a per-(PR, provider) issue
#                                     in HarperFast/ai-review-log

on:
  workflow_call:
    inputs:
      review-layers:
        description: 'Newline-separated layer names (e.g. "universal\nharper/common\nharper/v5"). Same files as _claude-review.yml — review scope is provider-agnostic.'
        type: string
        required: true
      repo-specific-checks:
        description: 'Markdown block injected after the layered review scope. Same shape and content as the matching input on _claude-review.yml — keep the two callers in sync per repo so output comparability holds.'
        type: string
        default: ''
      model:
        description: 'Gemini model id passed to run-gemini-cli. Defaults to `gemini-3-flash-preview` — Google''s current-generation mid-tier Flash, which is the apples-to-apples peer of Claude Sonnet 4.6 on `_claude-review.yml`. Preview status: Google deprecates preview models with ≥2 weeks notice and may shift behavior; in practice this model has been stable for routine use. Override to a GA model (e.g. `gemini-2.5-flash`) if preview-drift on every `pull_request` run is a concern. Reserve Pro-tier (currently `gemini-3-pro` / `gemini-2.5-pro`) for deep-review / label-triggered thorough modes (Pro mirrors Opus on the Claude side).'
        type: string
        default: 'gemini-3-flash-preview'
      gemini-cli-version:
        description: 'Gemini CLI version pin. Accepts a tag (e.g. v0.5.0), branch, commit SHA, or "latest" / "preview" / "nightly". Pin tightly during calibration.'
        type: string
        default: 'latest'
      timeout-minutes:
        description: 'Job-level timeout for the review job. Down from 15 (the single-shot default) because MCP-based agentic mode lets the agent fetch only what it needs rather than reasoning over a giant front-loaded prompt — runs should converge faster.'
        type: number
        default: 10
      skills-ref:
        description: 'SHA pin for HarperFast/skills (referenced when a layer points into harper-best-practices/). Same default as _claude-review.yml; bump together.'
        type: string
        default: 'd2db99bb37a6dde868cbc5ac81ca4146be8956fb'  # 1.3.0 (2026-04-16)
      ai-review-prompts-ref:
        description: 'SHA pin for HarperFast/ai-review-prompts (layer files + scripts). REQUIRED; pass the same SHA the caller uses in its `uses:` ref. Same constraint as _claude-review.yml — `github.workflow_ref` resolves to the CALLER''s ref in `workflow_call` context, not the called workflow''s ref.'
        type: string
        required: true
    secrets:
      GEMINI_API_KEY:
        # Optional on purpose: Gemini coverage is opt-in per repo.
        # A consumer that ships a `gemini-review.yml` caller but
        # hasn't (yet) configured the secret should not have its
        # `pull_request` pipeline fail loudly. The authorize job
        # checks for the secret and emits a workflow notice that
        # cleanly skips the review job when it's missing —
        # parallel to the AI_REVIEW_LOG_TOKEN behavior on the
        # log step.
        required: false
      AI_REVIEW_LOG_TOKEN:
        # Optional. If set, each review run threads a comment to
        # the per-(PR, provider) issue in HarperFast/ai-review-log.
        # If absent, the log step skips with a workflow notice.
        required: false
      HARPERFAST_AI_CLIENT_ID:
        required: true
      HARPERFAST_AI_APP_PRIVATE_KEY:
        required: true

# Default-deny at the workflow level; each job declares its own
# minimum-scope `permissions:` block. The per-job grants are the
# load-bearing protection; this `{}` is defense-in-depth.
permissions: {}

jobs:
  authorize:
    # Same shape as _claude-review.yml's authorize job; reuses the
    # provider-agnostic authorize-ai-workflow.sh script that checks
    # USERS_TO_CHECK against the CODEOWNERS-derived HarperFast trust
    # set.
    #
    # We check the same two identities: the PR's original author
    # and the event actor (synchronize pusher, etc.). `claude[bot]`
    # is NOT admitted here — Gemini review fires on
    # `pull_request`, not on Claude-issue-to-PR's bot output. If we
    # later add Gemini review on bot-authored PRs, set
    # ADMIT_CLAUDE_BOT='true' (same as the Claude reviewer does for
    # its own bot-authored PRs).
    #
    # ALSO checks for the presence of GEMINI_API_KEY and emits a
    # second output. The review job's `if:` requires BOTH
    # authorization AND key presence — a missing key cleanly skips
    # the review with a notice instead of failing the workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
      has-gemini-key: ${{ steps.gemini-key.outputs.has-key }}
    steps:
      - name: Mint org-read token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
          private-key: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}
          owner: HarperFast

      - name: Sparse-checkout ai-review-prompts auth script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/ai-review-prompts
          ref: ${{ inputs.ai-review-prompts-ref }}
          path: .ai-review-prompts
          sparse-checkout: |
            .github/scripts/authorize-ai-workflow.sh
          sparse-checkout-cone-mode: false

      - name: Check authorization (PR author + event actor)
        id: check
        env:
          DEFAULT_TOKEN: ${{ github.token }}
          ORG_TOKEN: ${{ steps.app-token.outputs.token }}
          ADMIT_CLAUDE_BOT: 'false'
          USERS_TO_CHECK: |
            ${{ github.event.pull_request.user.login }}
            ${{ github.actor }}
        run: bash .ai-review-prompts/.github/scripts/authorize-ai-workflow.sh

      - name: Check for Gemini API key
        id: gemini-key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::GEMINI_API_KEY secret not set on ${GITHUB_REPOSITORY}; skipping Gemini review."
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true' && needs.authorize.outputs.has-gemini-key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write # required by run-gemini-cli for OIDC

    steps:
      - name: Checkout
        # Full history so the agent can use `git blame` / `git log`
        # / `git diff <base>...HEAD` for context — who wrote a line,
        # how old it is, whether this PR's author has touched it
        # before. Available to the agent via the `run_shell_command`
        # allowlist below.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Clone shared Harper skills
        # Same pin model as _claude-review.yml — explicit SHA so
        # review behavior is reproducible across runs.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/skills
          ref: ${{ inputs.skills-ref }}
          path: .harper-skills

      - name: Clone review prompts (full)
        # Layer files + scripts + TOML template. Same SHA the caller
        # pinned for the `uses:` ref above — see _claude-review.yml
        # comments for the dual-SHA rationale.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/ai-review-prompts
          ref: ${{ inputs.ai-review-prompts-ref }}
          path: .ai-review-prompts

      - name: Compose review scope from layers
        id: scope
        env:
          LAYERS: ${{ inputs.review-layers }}
        run: bash .ai-review-prompts/.github/scripts/compose-review-scope.sh

      - name: Build ADDITIONAL_CONTEXT for upstream /pr-code-review
        # We invoke the upstream code-review extension's slash
        # command (`/pr-code-review`) rather than a custom one.
        # The upstream prompt substitutes `$ADDITIONAL_CONTEXT`
        # at prompt-render time, so this is the hook for layering
        # Harper-specific instructions on top of the calibrated
        # base prompt.
        #
        # History: earlier iterations composed a full custom
        # `.gemini/commands/harper-review.toml` and invoked it as
        # `/harper-review`. Those iterations hit "agent ignores the
        # custom prompt and reverts to training-instinct shell
        # discovery" — the upstream slash command sidesteps that
        # by being the exact pattern the model was trained on.
        # `prompts/gemini-review.toml.template` + the legacy
        # composer script (`compose-gemini-review-toml.sh`) are
        # retained in the repo for reference / rollback but no
        # longer wired into this workflow.
        id: additional_context
        env:
          REVIEW_SCOPE: ${{ steps.scope.outputs.composed }}
          REPO_SPECIFIC_CHECKS: ${{ inputs.repo-specific-checks }}
          MARKER: '<!-- gemini-review:v1 -->'
        run: |
          {
            echo "ctx<<HARPER_ADDITIONAL_CONTEXT_EOF"
            echo "## Harper review scope (layered)"
            echo
            echo "Apply the following Harper-specific review scope on top of the upstream code-review skill's defaults. These layers are the authoritative review checklist for this repo:"
            echo
            echo "${REVIEW_SCOPE}"
            echo
            if [ -n "${REPO_SPECIFIC_CHECKS}" ]; then
              echo "${REPO_SPECIFIC_CHECKS}"
              echo
            fi
            echo "## Harper severity discipline"
            echo
            echo "- Post ONLY findings tagged 🔴 Critical or 🟠 High. 🟡 Medium and 🟢 Low map to the universal-scope 'do not post' category in our layered scope."
            echo "- Cap the review at 10 findings."
            echo
            echo "## Trivial-diff short-circuit"
            echo
            echo "If the diff is trivial (dependency version bumps, CI workflow pin updates, lockfile-only churn, prose-only doc changes, version-string bumps), do NOT generate findings about code outside the diff. The summary body in that case is exactly:"
            echo
            echo "    Reviewed; no blockers found."
            echo
            echo "Skip the 🔍 General Feedback section entirely on trivial diffs."
            echo
            echo "## Submission marker (REQUIRED)"
            echo
            echo "The submitted review summary MUST begin with the literal first line:"
            echo
            echo "    ${MARKER}"
            echo
            echo "Followed by a blank line, then the standard ## 📋 Review Summary section. This marker is what threads runs together across pushes — without it, our log surface cannot find this review on subsequent runs."
            echo "HARPER_ADDITIONAL_CONTEXT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find prior review marker
        id: prior_review
        # Gemini's review posting surface is the GitHub Review API
        # (`/repos/.../pulls/<N>/reviews`), NOT top-level issue
        # comments. The shared find-prior script supports both via
        # the LOOKUP_API_PATH env var — see the script's header.
        # The marker convention still applies; the agent is told to
        # put `<!-- gemini-review:v1 -->` at the start of its
        # submission summary.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: '<!-- gemini-review:v1 -->'
          LOOKUP_API_PATH: 'repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews'
        run: bash .ai-review-prompts/.github/scripts/find-prior-review-comment.sh

      - name: Run Gemini review
        id: gemini-review
        # Pinned to v0.1.22 of run-gemini-cli (2026-04-24).
        # `gemini_cli_version` (input above) is separate — it pins
        # the CLI binary the action installs, not the action wrapper
        # itself.
        #
        # MCP server image pinned by sha256 digest. The tag
        # comment (`# v1.0.4 (2026-05-11)`) is human-readable
        # only — the digest is authoritative. Bumping the image
        # requires fetching the new digest fresh; tags are
        # mutable and don't meet our pinning discipline.
        # github-mcp-server is GitHub's official MCP server (see
        # github/github-mcp-server).
        #
        # Digest lookup: GHCR's anonymous bearer-token endpoint
        # plus a manifest fetch returns the digest in the
        # `docker-content-digest` response header:
        #
        #   GHCR_TOKEN=$(curl -sSL \
        #     "https://ghcr.io/token?scope=repository:github/github-mcp-server:pull&service=ghcr.io" \
        #     | jq -r .token)
        #   curl -sSI -H "Authorization: Bearer $GHCR_TOKEN" \
        #     -H "Accept: application/vnd.oci.image.index.v1+json" \
        #     "https://ghcr.io/v2/github/github-mcp-server/manifests/v1.0.4" \
        #     | grep -i docker-content-digest
        #
        # Tool allowlist via `mcpServers.github.includeTools`
        # matches upstream's pr-review example exactly. The
        # upstream `/pr-code-review` slash command uses the
        # pending-review flow (create_pending → add_comments →
        # submit_pending). Prior atomic-submission iteration
        # (#33) tried to sidestep the race but didn't help because
        # the agent was never reaching MCP in the first place
        # (#34/#35 root cause analysis). Trust the upstream's
        # calibrated prompt to navigate the pending flow.
        #   - `pull_request_read` (umbrella: get, get_diff,
        #     get_files, get_comments, get_review_comments,
        #     get_reviews)
        #   - `pull_request_review_write` (umbrella; the upstream
        #     prompt calls flat names like
        #     `create_pending_pull_request_review` /
        #     `submit_pending_pull_request_review` through this
        #     umbrella)
        #   - `add_comment_to_pending_review` (per-line comments
        #     during the pending flow)
        # NOT included: anything that creates/modifies issues,
        # branches, or repo configuration. Defense in depth even
        # though the GITHUB_TOKEN's `pull-requests: write` scope
        # already bounds what's possible.
        #
        # Shell allowlist (`tools.core`) mirrors upstream's
        # pr-review example exactly (`cat`, `echo`, `grep`,
        # `head`, `tail`). `git` is intentionally OMITTED — the
        # upstream slash command's prompt does not call git and
        # the agent's git instincts (`git log`, `git diff`,
        # `git rev-parse`, `git remote -v`) are what we're trying
        # to suppress; if the agent tries git, the deny tells it
        # to fall back to MCP, which is what we want.
        #
        # PR-context env vars (PULL_REQUEST_NUMBER, REPOSITORY,
        # ISSUE_TITLE, ISSUE_BODY, ADDITIONAL_CONTEXT) — required
        # by the upstream `/pr-code-review` slash command. The
        # slash command substitutes these at prompt-render time
        # using `$NAME` syntax, so the agent sees concrete values
        # rather than shell-syntax cues.
        #
        # `gemini_debug` stays on for this iteration so we can
        # verify the pivot end-to-end. Disable in the next bump
        # if clean.
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          # Upstream pr-review-example contract — the upstream
          # `/pr-code-review` slash command substitutes these
          # by name. See examples/workflows/pr-review/ in
          # google-github-actions/run-gemini-cli and
          # commands/pr-code-review.toml in
          # gemini-cli-extensions/code-review.
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_BODY: ${{ github.event.pull_request.body }}
          # Our Harper-specific layered scope + repo-specific
          # checks + severity discipline + marker requirement.
          # Built by the "Build ADDITIONAL_CONTEXT" step above.
          ADDITIONAL_CONTEXT: ${{ steps.additional_context.outputs.ctx }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ inputs.model }}
          gemini_cli_version: ${{ inputs.gemini-cli-version }}
          gemini_debug: 'true'
          upload_artifacts: 'true'
          # Explicit PR number for the MCP github_pr_number input —
          # belt-and-suspenders alongside PULL_REQUEST_NUMBER env var.
          # Mirrors upstream pr-review example.
          github_pr_number: ${{ github.event.pull_request.number }}
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          settings: |-
            {
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "model": {
                "maxSessionTurns": 20
              },
              "modelConfigs": {
                "aliases": {
                  "gemini-3-flash-preview": {
                    "extends": "chat-base-3",
                    "modelConfig": {
                      "model": "gemini-3-flash-preview",
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "LOW"
                        }
                      }
                    }
                  }
                }
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server@sha256:e3816a476a977cfb836e7d221510011436c654d11861db66ecfd826601aba6a4"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)"
                ]
              }
            }
          # Upstream slash command from the
          # gemini-cli-extensions/code-review extension (loaded
          # via `extensions:` above). The prompt body contains
          # literal `$REPOSITORY` / `$PULL_REQUEST_NUMBER` /
          # `$ADDITIONAL_CONTEXT` references — these are NOT
          # substituted at prompt-render time; the agent is
          # expected to read them at runtime via shell. Our
          # `tools.core` allowlist includes `echo` for exactly
          # this purpose. Harper-specific scope is layered in
          # via the ADDITIONAL_CONTEXT env var.
          prompt: '/pr-code-review'

      - name: Upload gemini-artifacts (failure path)
        # Workaround for an upstream visibility gap: the
        # run-gemini-cli action's "Upload Gemini CLI outputs"
        # inner step is `if: inputs.upload_artifacts == 'true'`
        # but NOT `if: always()`. When the inner gemini-cli
        # bash step exits non-zero, the upload inner step is
        # short-circuited by composite-action failure semantics
        # — so on the exact runs we most want logs from, none
        # are uploaded.
        #
        # The wrapper script writes `gemini-artifacts/{stdout,
        # stderr,telemetry}.log` BEFORE its `exit 1`, so the
        # files exist on disk. We just need to upload them
        # ourselves. `if: failure()` makes this a no-op on
        # the success path (the inner step's upload handles
        # that case as `gemini-output`).
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gemini-output-failure
          path: gemini-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Append gemini logs tail to job summary
        # At-a-glance diagnostics for failed Gemini runs without
        # needing to download the artifact zip. Trims to a
        # bounded size so the summary doesn't blow past GitHub's
        # 1 MB per-job limit.
        if: failure()
        run: |
          set -euo pipefail
          if [ ! -d gemini-artifacts ]; then
            echo "## ⚠️ Gemini run failed (no gemini-artifacts/ directory)" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "The gemini-cli wrapper exited before writing logs to disk." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## ⚠️ Gemini run failed — log tails"
            echo
            echo "Full logs uploaded as the \`gemini-output-failure\` artifact."
            echo
            for f in stdout.log stderr.log telemetry.log; do
              if [ -f "gemini-artifacts/$f" ] && [ -s "gemini-artifacts/$f" ]; then
                echo "### \`gemini-artifacts/$f\` (last 200 lines)"
                echo
                echo '```'
                tail -n 200 "gemini-artifacts/$f" | head -c 50000
                echo
                echo '```'
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log review to ai-review-log
        # Best-effort — never fail the job if logging fails. Feeds
        # the central HarperFast/ai-review-log issue tracker
        # alongside the Claude reviewer's entries; both providers
        # thread into one issue per (PR, provider).
        #
        # Gemini's surface is the GitHub Review API
        # (`/repos/.../pulls/<N>/reviews`), so we point the shared
        # log script at that endpoint via LOOKUP_API_PATH. The
        # script's marker filter still applies — the agent is
        # instructed to embed `<!-- gemini-review:v1 -->` in the
        # review's summary body.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AI_REVIEW_LOG_TOKEN: ${{ secrets.AI_REVIEW_LOG_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_STATUS: ${{ steps.gemini-review.outcome }}
          REPO_SHORT: ${{ github.event.repository.name }}
          MARKER: '<!-- gemini-review:v1 -->'
          MODEL: ${{ inputs.model }}
          PROVIDER_LABEL: gemini
          NOTES_FILE_BASENAME: gemini-review-notes.md
          LOOKUP_API_PATH: 'repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews'
        run: bash .ai-review-prompts/.github/scripts/log-review-to-ai-review-log.sh

name: Auth gate invariants

# Validates that the AI workflow auth gate structure is preserved
# across the reusable workflows in this repo. Runs on any PR that
# touches a `_<provider>-{review,mention,issue-to-pr}.yml` reusable,
# the validator workflow itself, the auth script, or this validator
# script.
#
# STRUCTURAL lint, not a semantic test. Catches the obvious attacks
# (delete the authorize job, drop the `needs:` dependency, broaden
# permissions, weaken the if-expression to admit unauthorized runs).
# Subtle attacks (e.g., modifying the bash logic inside the auth
# check to admit everyone) are caught by CODEOWNERS review, which
# requires both `@HarperFast/developers` and `@HarperFast/devops`
# approval on `.github/` changes.
#
# Defense in depth — make this workflow a REQUIRED status check on
# this repo's `main` via branch protection so PRs can't merge without
# it passing.

on:
  pull_request:
    paths:
      - '.github/workflows/_*-review.yml'
      - '.github/workflows/_*-mention.yml'
      - '.github/workflows/_*-issue-to-pr.yml'
      - '.github/workflows/auth-gate-invariants.yml'
      - '.github/scripts/authorize-ai-workflow.sh'
      - '.github/scripts/validate-auth-gate-invariants.sh'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate auth gate structure
        run: bash .github/scripts/validate-auth-gate-invariants.sh

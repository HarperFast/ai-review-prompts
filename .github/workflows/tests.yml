name: Script tests

# Runs the zero-dependency bash unit tests for .github/scripts/ on any
# PR that touches the scripts, the tests, this workflow, or package.json.
# Scope is PURE-LOGIC only (no `gh` / network) — the gh-orchestration
# scripts (post-review-comment, find-prior-review-comment,
# log-review-to-ai-review-log) are exercised by the live review dogfood
# instead. See tests/README.md. Make this a required check on `main`.

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run script unit tests
        run: bash tests/run.sh
